[package]
name = "halo-1"
version = "0.1.0"
description = "Halo-1 topbar overlay for Windows"
authors = ["DanielsFega"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "halo_1_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.35.2"
windows = { version = "0.62.1", features = ["Devices_Power", "Foundation", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }

